# Builds Rembrandt for every platform and publishes a GitHub release.
#
#   Desktop app  macOS Apple silicon (.dmg), macOS Intel (.dmg), Windows x64 (.exe, .msi),
#                Windows ARM64 (.exe), Linux x86_64 and arm64 (.AppImage, .deb, .rpm, PKGBUILD)
#   Server       rembrandt-server for Linux x86_64/arm64 (static), macOS arm64/x64, Windows x64/arm64,
#                each bundled with the web app
#
# Runs on version tags (v*) and publishes the release. A manual run builds everything; with
# "publish" ticked it also tags the version in package.json (v<version>) and publishes it.
#
# Signing (optional; unsigned builds work but macOS and Windows warn on first open):
#   macOS    APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#   Windows  WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
name: Rembrandt - auto sync and multi-platform release
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: Build and republish the current upstream revision
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/auto-sync-release.yml'
      - '.github/workflows/build-mirror.yml'
      - '.github/scripts/sync-upstream.sh'
      - '.github/docs/AUTO_BUILD.md'

permissions:
  contents: write
concurrency:
  group: rembrandt-upstream-mirror-and-release
  cancel-in-progress: false

jobs:
  sync:
    name: Detect changes in official upstream
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.mirror.outputs.changed }}
      source_sha: ${{ steps.mirror.outputs.source_sha }}
      mirror_sha: ${{ steps.mirror.outputs.mirror_sha }}
    steps:
      - name: Checkout local mirror
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - name: Mirror upstream on SHA change
        id: mirror
        shell: bash
        run: bash .github/scripts/sync-upstream.sh

  desktop:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || github.event_name == 'push' || inputs.force_build == true
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS Apple silicon, os: macos-latest, target: aarch64-apple-darwin, args: '--target aarch64-apple-darwin --bundles dmg', server: macos-aarch64 }
          - { name: macOS Intel, os: macos-latest, target: x86_64-apple-darwin, args: '--target x86_64-apple-darwin --bundles dmg', server: macos-x86_64 }
          - { name: Windows x64, os: windows-latest, target: x86_64-pc-windows-msvc, args: '--target x86_64-pc-windows-msvc --bundles nsis,msi', server: windows-x86_64 }
          - { name: Windows ARM64, os: windows-latest, target: aarch64-pc-windows-msvc, args: '--target aarch64-pc-windows-msvc --bundles nsis', server: windows-aarch64 }
          - { name: Linux x86_64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, args: '--target x86_64-unknown-linux-gnu --bundles deb,rpm,appimage', server: linux-x86_64, musl: x86_64-unknown-linux-musl }
    uses: ./.github/workflows/build-mirror.yml
    with:
      source_ref: ${{ needs.sync.outputs.mirror_sha }}
      os: ${{ matrix.os }}
      target: ${{ matrix.target }}
      args: ${{ matrix.args }}
      server: ${{ matrix.server }}
      musl: ${{ matrix.musl || '' }}
    secrets: inherit

  # GitHub's arm64 Linux runners are free for public repositories. While the repository is private
  # this build is skipped (set the repository variable ARM_LINUX=true if your plan includes them).
  desktop-linux-arm64:
    name: Linux arm64
    needs: sync
    if: ${{ (needs.sync.outputs.changed == 'true' || github.event_name == 'push' || inputs.force_build == true) && (!github.event.repository.private || vars.ARM_LINUX == 'true') }}
    uses: ./.github/workflows/build-mirror.yml
    with:
      source_ref: ${{ needs.sync.outputs.mirror_sha }}
      os: ubuntu-22.04-arm
      target: aarch64-unknown-linux-gnu
      args: --target aarch64-unknown-linux-gnu --bundles deb,rpm,appimage
      server: linux-aarch64
      musl: aarch64-unknown-linux-musl
    secrets: inherit

  publish:
    needs: [sync, desktop, desktop-linux-arm64]
    if: ${{ !cancelled() && (needs.sync.outputs.changed == 'true' || github.event_name == 'push' || inputs.force_build == true) && needs.desktop.result == 'success' && needs.desktop-linux-arm64.result != 'failure' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      SOURCE_SHA: ${{ needs.sync.outputs.source_sha }}
      MIRROR_SHA: ${{ needs.sync.outputs.mirror_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sync.outputs.mirror_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: dl, pattern: rembrandt-*, merge-multiple: true }
      - name: Checksums and Arch package recipe
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "TAG=rembrandt-v${VERSION}-${SOURCE_SHA:0:12}" >> "$GITHUB_ENV"
          cd dl
          DEB_SHA=$(sha256sum Rembrandt-linux-amd64.deb | cut -d' ' -f1)
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$DEB_SHA/" ../packaging/arch/PKGBUILD.in > PKGBUILD
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # Creates the tag on this commit if it doesn't exist yet (manual runs).
        # Adds the files to the release if it already exists (re-runs), otherwise creates it.
        run: |
          set -euo pipefail
          test -s dl/SHA256SUMS
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Unofficial automated Rembrandt builds from the official upstream main branch.
          Upstream: https://github.com/thesnarkitecht/rembrandt
          Upstream SHA: ${SOURCE_SHA}
          Mirror commit: ${MIRROR_SHA}
          macOS apps are ad-hoc signed; Windows installers are unsigned.
          These are development snapshots, not official upstream stable releases.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dl/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dl/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$MIRROR_SHA" \
              --prerelease \
              --title "Rembrandt ${TAG#rembrandt-v} (unofficial multi-platform)" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
